<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b83263" />
    <meta name="description" content="Explore skincare, facials, hair, nails, bridal beauty, makeup and personal-care services at Sruthy Lakshmi’s Beauty Zone." />
    <title>Contact Us | Beauty Zone</title>
    <link rel="preload" as="image" href="/images/beauty-zone-logo.png" />
    <style>
      .site-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; transition: opacity .6s ease, visibility .6s ease; }
      .site-loader img { width: min(360px, 82vw); height: auto; display: block; }
      .site-loader-track { width: 110px; height: 2px; margin-top: -24px; background: #f5ead6; overflow: hidden; border-radius: 2px; }
      .site-loader-track::after { content: ''; display: block; width: 45%; height: 100%; background: linear-gradient(90deg, #eac56b, #b67b20, #ff9900); animation: loader-glide 1.3s ease-in-out infinite; }
      .site-loader.is-finished { opacity: 0; visibility: hidden; pointer-events: none; }
      body:has(.site-loader:not(.is-finished)) { overflow: hidden; }
      @keyframes loader-glide { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) { .site-loader { transition: none; } .site-loader-track::after { animation: none; width: 100%; } }
    </style>
    <noscript><style>.site-loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="site-loader" class="site-loader" role="status" aria-label="Loading Sruthy Lakshmi’s Beauty Zone">
      <img src="/images/beauty-zone-logo.png" alt="Sruthy Lakshmi’s Beauty Zone" width="447" height="447" />
      <span class="site-loader-track" aria-hidden="true"></span>
    </div>
    <script>
      // Keep the page accessible even if the application fails to start.
      window.setTimeout(function () {
        document.getElementById('site-loader')?.remove();
      }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
